name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build and Sync Latest Web Assets to Android
        run: |
          npm run build
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.5.0.apk
            cp -f app-debug.apk asmo-inventory-v1.6.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.6.0
          name: "ASMO Inventory App v1.6.0 (حفظ تلقائي فوري بدون رقم سري + محرك OCR المتوازي)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار المحدث v1.6.0)
            - **الحفظ والاعتماد التلقائي الفوري بعد انتهاء القراءة**: يتم حفظ واعتماد الأصناف المستخرجة مباشرة في قاعدة البيانات والمستندات فور انتهاء المسح الضوئي دون طلب أي رقم سري (PIN).
            - **محرك القراءة المتوازي المحسن (3 Parallel Workers)**: معالجة 3 شرائح أفقية متداخلة بالتوازي مع تصحيح الأرقام الـ 10 (`1007->1001`, `1900->1000`) واستنتاج المواقع بالساندويتش السياقي.
            - **توحيد الإضاءة وحذف خطوط الشبكة مع حفظ الحروف** (`Integral Image + Unsharp Mask`).
          files: |
            output_apk/asmo-inventory-v1.6.0.apk
            output_apk/asmo-inventory-v1.5.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
