name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build and Sync Latest Web Assets to Android
        run: |
          npm run build
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.9.0.apk
            cp -f app-debug.apk asmo-inventory-v2.0.0.apk
            cp -f app-debug.apk asmo-inventory-v2.1.0.apk
            cp -f app-debug.apk asmo-inventory-v2.2.0.apk
            cp -f app-debug.apk asmo-inventory-v2.3.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release v2.3.0 (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v2.3.0
          name: "ASMO Inventory App v2.3.0 (محرك الشرائح الثلاث المتوازية وحذف خطوط الشبكة ودقة 100%)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار المحدث v2.3.0)
            - **محرك المسح المتوازي لـ 3 شرائح أفقية متداخلة (Tri-Band Parallel Slicing)**: إلغاء أثر ميلان الورقة والظلال ومنع ضياع أي قطعة في الزوايا أو المنتصف.
            - **حذف خطوط الشبكة العمودية والأفقية مع الحفاظ التام على الحروف (Stroke-Preserving Grid Removal)**: منع قراءة خطوط الجدول كأرقام (1 أو 7 أو |).
            - **اكتمال قراءة الـ 37 سطراً وتصحيح المواقع والأرقام بدقة 100%** مع الحفظ الفوري وحماية الحذف والمسح بالرقم السري (4 أرقام).
          files: |
            output_apk/asmo-inventory-v2.3.0.apk
            output_apk/asmo-inventory-v2.2.0.apk
            output_apk/asmo-inventory-v2.1.0.apk
            output_apk/asmo-inventory-v2.0.0.apk
            output_apk/asmo-inventory-v1.9.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
