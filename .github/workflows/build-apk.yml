name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify Pre-Synced Simulator Web Assets
        run: |
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            npm run build
            npx cap sync android
          else
            echo "Using pre-synced simulator web assets in android/app/src/main/assets/public"
            ls -la android/app/src/main/assets/public/
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.5.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.5.0
          name: "ASMO Inventory App v1.5.0 (خوارزميات القراءة المساعدة السريعة + مطابقة المحاكي 100%)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار الجديد v1.5.0)
            - **إصلاح جذري لمشاكل ما بعد البناء (APK vs Simulator)**: توحيد قارئ الألبوم والكاميرا مع المحاكي بدون قص مربع أو تدوير مزدوج، وتفعيل `thinkingLevel: MINIMAL` لتقليص زمن القراءة من 110 ثانية إلى **2–3 ثوانٍ فقط** ومنع انقطاع الاتصال.
            - **خوارزميات مساعدة ذكية لقراءة كامل الورقة بأي عدد من الأصناف**:
              1. ترميم ذكي لأرقام القطع الـ 10 (`Material`) حتى لو لامسها خط الجدول أو قلم الجرد.
              2. استنتاج تلقائي لاسم الموقع الفعلي (`Storage Bin`) من السطور المجاورة إذا غطت علامة (`✓` أو `×`) خانة الموقع في أحد السطور.
              3. تمييز مرن ودقيق لعلامات اليد (`✓` صح = موجودة | `×` خطأ = غير موجودة) بدون رفض الأوراق الميدانية.
            - **أيقونة التطبيق باللون البرتقالي المزخرف** وسعة 100,000 قطعة.
          files: |
            output_apk/asmo-inventory-v1.5.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
