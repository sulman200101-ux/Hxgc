name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.3.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.3.0
          name: "ASMO Inventory App v1.3.0 (إصدار فائق السرعة 100 ألف قطعة)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار الجديد v1.3.0)
            - تسريع القراءة من الكاميرا والألبوم (5x Faster OCR).
            - قراءة صارمة لأرقام القطع المكونة من 10 أرقام (Material) وأسماء المواقع الفعلية (Storage Bin) ومنع موقع "عام".
            - قفل رفع الورقة إلا بعد اكتمال القراءة 100%.
            - التعرف التلقائي على علامة (×) بخط اليد وتخزينها بعلامة (× غير موجودة).
            - توسيع محرك البيانات ليتسع إلى 100,000 قطعة دون أي بطء أو انهيار.
          files: |
            output_apk/asmo-inventory-v1.3.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact (Optional Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ASMO-Inventory-Capacitor-APK
          path: output_apk/asmo-inventory-v1.3.0.apk
          retention-days: 5
