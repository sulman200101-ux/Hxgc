name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Verify Pre-Synced Simulator Web Assets
        run: |
          if [ ! -f android/app/src/main/assets/public/index.html ]; then
            npm run build
            npx cap sync android
          else
            echo "Using pre-synced simulator web assets in android/app/src/main/assets/public"
            ls -la android/app/src/main/assets/public/
          fi

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.4.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.4.0
          name: "ASMO Inventory App v1.4.0 (قراءة 37 صنف كاملة + أيقونة برتقالي مزخرف)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار الجديد v1.4.0)
            - قراءة حقيقية كاملة 100% لجميع أصناف الورقة (37 صنفاً بالكامل كما في المحاكي) وإلغاء أي قراءة ناقصة أو وهمية نهائياً.
            - تحذير صوتي وبصري صارم عند وجود أي نقص أو عدم وضوح في الورقة لإعادة رفعها أو تصويرها فوراً.
            - تدوير تلقائي ذكي للأوراق المصورة طولياً من الجوال لقراءة الجدول بالعرض بدقة تامة.
            - تحديث أيقونة التطبيق إلى اللون البرتقالي المزخرف.
            - سعة 100,000 قطعة مع البحث الفوري برقم القطعة (10 أرقام) أو اسم القطعة أو الموقع الفعلي.
          files: |
            output_apk/asmo-inventory-v1.4.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
