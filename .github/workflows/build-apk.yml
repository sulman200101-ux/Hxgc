name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build and Sync Latest Web Assets to Android
        run: |
          npm run build
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
          mkdir -p ../output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} ../output_apk/ \; || true
          cd ../output_apk
          if [ -f app-debug.apk ]; then
            cp -f app-debug.apk asmo-inventory-app.apk
            cp -f app-debug.apk asmo-inventory-v1.9.0.apk
            cp -f app-debug.apk asmo-inventory-v2.0.0.apk
            cp -f app-debug.apk asmo-inventory-v2.1.0.apk
          fi
          cd ..
          echo "=== Generated Native APKs ==="
          ls -lh output_apk/

      - name: Create or Update GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v2.1.0
          name: "ASMO Inventory App v2.1.0 (دقة رقمية صارمة 100% للأرقام الـ 10 ومنع تغير أي خانة)"
          body: |
            ## 📱 تطبيق إدارة وجرد قطع الغيار - أسمو (الإصدار المحدث v2.1.0)
            - **دقة رقمية 100% ومنع تغير أي خانة في رقم القطعة (10 أرقام)**: محرك المعايرة والتدقيق الرقمي الرباعي (SAP 10-Digit Precision & Monotonic Calibration Engine).
            - **معايرة رتيبة لعمود التسلسل (Item/Seq) والترتيب التصاعدي داخل الرف**: قفل الخانات الأولى رياضياً وإصلاح التباس الأرقام المتشابهة بصرياً (3/8, 5/6, 0/8, 1/7) ومنع تداخل رقم التسلسل مع رقم القطعة.
            - **المطابقة الذكية بين التمريرات عالية الدقة**: دمج قراءات النصفين المتداخلين مع القراءة الكاملة لاختيار الرقم الصحيح 100% دون تكرار السطر بأرقام محرفة.
            - **قراءة شاملة لكامل سطور الورقة دون تخطي ومع اعتماد علامة الناقص (-) فقط**.
          files: |
            output_apk/asmo-inventory-v2.1.0.apk
            output_apk/asmo-inventory-v2.0.0.apk
            output_apk/asmo-inventory-v1.9.0.apk
            output_apk/asmo-inventory-app.apk
            output_apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
